<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBound | Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --jetstar-orange: #ff5100; --bg-light: #f4f4f4; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', Roboto, sans-serif; }
        .navbar { background-color: white; border-bottom: 3px solid var(--jetstar-orange); }
        .btn-orange { background-color: var(--jetstar-orange); color: white; font-weight: bold; }
        .btn-orange:hover { background-color: #e64900; color: white; }
    </style>
</head>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="color: var(--jetstar-orange);">SKYBOUND</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/">Flights</a>
            <a class="nav-link" href="#">My Bookings</a>
            <a class="nav-link btn btn-outline-dark ms-lg-3" href="/admin">Admin Login</a>
        </div>
    </div>
</nav>

<body>
    <div class="table-responsive">
    <table class="table">
        <thead>
            <tr>
            <th scope="col">booking_id</th>
            <th scope="col">flight_id</th>
            <th scope="col">passenger_id</th>
            <th scope="col">seat_assignment</th>
            </tr>
        </thead>
        {%for book in bookings%}
        <tbody>
            <tr>
            <th scope="row">{{book.booking_id}}</th>
            <td>{{book.flight_id}}</td>
            <td>{{book.passenger_id}}</td>
            <td>{{book.seat_assignment}}</td>
            </tr>
        </tbody>        
        {%endfor%}
    </table>
    </div>
</body>
