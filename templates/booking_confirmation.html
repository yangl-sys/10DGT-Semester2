<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBound | Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --jetstar-orange: #ff5100; --bg-light: #f4f4f4; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', sans-serif; }
        .ticket-card { border: none; border-top: 8px solid var(--jetstar-orange); border-radius: 8px; background: white; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="text-success display-4 mb-3">✓</div>
            <h2 class="fw-bold mb-4">You're cleared for takeoff!</h2>
            
            <div class="card ticket-card text-start shadow-sm p-4 mb-4">
                <span class="text-muted small font-monospace text-uppercase">Boarding Pass</span>
                <h4 class="fw-bold my-2 text-dark">{{ booking.first_name }} {{ booking.last_name }}</h4>
                <hr>
                <div class="row mb-3">
                    <div class="col-6">
                        <span class="text-muted d-block small">Flight</span>
                        <strong>#{{ booking.flight_id }}</strong>
                    </div>
                    <div class="col-6">
                        <span class="text-muted d-block small">Seat</span>
                        <strong class="text-primary">{{ booking.seat_assignment }}</strong>
                    </div>
                </div>
                <div class="mb-3">
                    <span class="text-muted d-block small">Route</span>
                    <strong>{{ booking.origin }} to {{ booking.destination }}</strong>
                </div>
                <div>
                    <span class="text-muted d-block small">Departure</span>
                    <strong>{{ booking.departure_time }}</strong>
                </div>
            </div>
            
            <a href="/" class="btn btn-outline-dark px-4">Back to Search</a>
        </div>
    </div>
</div>
</body>
</html>
